<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja no Viralize</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --laranja:#ee4d2d; --laranja-escuro:#d8431f; --fundo:#f5f5f5;
    --texto:#222; --muted:#888; --borda:#eee;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--fundo);color:var(--texto);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding-bottom:70px;}

  .topo-marca{background:var(--laranja);color:#fff;text-align:center;font-size:12px;padding:6px;font-weight:600;letter-spacing:.3px;}

  /* Cabeçalho SEM capa (padrão, estilo Linktree) */
  header{background:var(--laranja);padding:22px 16px 40px;text-align:center;color:#fff;}
  .avatar-loja{width:64px;height:64px;border-radius:50%;background:#fff;color:var(--laranja);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;margin:0 auto 10px;border:3px solid rgba(255,255,255,.6);object-fit:cover;overflow:hidden;}
  .avatar-loja img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
  header h1{margin:0;font-size:19px;font-weight:700;}
  header p{margin:4px 0 0;font-size:12.5px;opacity:.9;}

  /* Cabeçalho COM capa (estilo Facebook: banner + avatar sobreposto na lateral) */
  .capa-wrap{position:relative;}
  .capa-img{width:100%;height:150px;object-fit:cover;display:block;background:var(--laranja);}
  .avatar-sobre-capa{position:absolute;left:16px;bottom:-32px;width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:#fff;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.15);}
  .avatar-sobre-capa img{width:100%;height:100%;object-fit:cover;}
  .avatar-sobre-capa .letra{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--laranja);color:#fff;font-weight:800;font-size:26px;}
  .header-com-capa-info{padding:40px 16px 14px;text-align:left;}
  .header-com-capa-info h1{margin:0;font-size:19px;font-weight:700;color:var(--texto);}
  .header-com-capa-info p{margin:4px 0 0;font-size:12.5px;color:var(--muted);}

  .busca-fake{max-width:560px;margin:-24px auto 0;padding:0 16px;}
  .busca-fake .caixa{background:#fff;border-radius:8px;padding:12px 14px;font-size:13px;color:var(--muted);box-shadow:0 2px 8px rgba(0,0,0,.08);}

  main{max-width:560px;margin:0 auto;padding:16px;}
  .titulo-secao{font-size:14px;font-weight:700;color:var(--texto);margin:16px 0 10px;padding-left:2px;}

  .grade{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .produto-card{background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);text-decoration:none;color:inherit;display:block;}
  .produto-card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f0f0f0;display:block;}
  .produto-card .info{padding:8px 10px 10px;}
  .produto-card .nome{font-size:12.5px;line-height:1.3;color:var(--texto);height:32px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-bottom:6px;}
  .produto-card .preco{color:var(--laranja);font-weight:800;font-size:15px;}
  .produto-card .selo{display:inline-block;background:var(--laranja);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;margin-bottom:4px;}
  .btn-compartilhar{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.92);border:none;border-radius:50%;width:28px;height:28px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:pointer;}

  .vazio{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;}

  .banner-cta{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--borda);padding:12px 16px;text-align:center;box-shadow:0 -2px 10px rgba(0,0,0,.06);}
  .banner-cta p{margin:0 0 8px;font-size:11.5px;color:var(--muted);}
  .banner-cta a{display:inline-block;background:var(--laranja);color:#fff;text-decoration:none;font-weight:700;padding:11px 22px;border-radius:20px;font-size:13px;}
</style>
</head>
<body>

<div class="topo-marca" id="topoMarca">🔥 Loja verificada • Powered by Viralize</div>

<div id="headerLoja"></div>

<div class="busca-fake" id="buscaFake">
  <input type="text" id="inputBusca" class="caixa" placeholder="🔍 Buscar nesta loja..." oninput="filtrarProdutos(this.value)" style="width:100%;border:none;font-size:13px;color:var(--texto);outline:none;font-family:inherit;box-sizing:border-box;">
</div>

<main>
  <div class="titulo-secao">🛍️ Produtos em destaque</div>
  <div class="grade" id="listaProdutos"></div>
</main>

<div class="banner-cta" id="bannerCta">
  <p>Quer ter uma loja como essa e vender pelos seus links de afiliado?</p>
  <a href="/">Criar minha conta grátis no Viralize</a>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCbfAv1pw1mO0OiajQZ8_LZUIZ_u2zZIXo",
  authDomain: "viralize-ef54c.firebaseapp.com",
  projectId: "viralize-ef54c",
  storageBucket: "viralize-ef54c.firebasestorage.app",
  messagingSenderId: "52430116190",
  appId: "1:52430116190:web:081c1a40c94e21cd79ebcf"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

let todosProdutosAtivos = [];
let uidLojaAtual = null;

function compartilharProduto(p){
  const texto = `Olha essa oferta: ${p.nome} — R$ ${p.preco || ''}`;
  if(navigator.share){
    navigator.share({ title: p.nome, text: texto, url: p.link }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(`${texto}\n${p.link}`);
    alert('Link copiado! Cole onde quiser compartilhar.');
  }
}

function renderizarProdutos(lista){
  const el = document.getElementById('listaProdutos');

  if(todosProdutosAtivos.length === 0){
    el.innerHTML = '<div class="vazio" style="grid-column:1/-1;">Essa loja ainda não tem produtos no catálogo.</div>';
    return;
  }
  if(lista.length === 0){
    el.innerHTML = '<div class="vazio" style="grid-column:1/-1;">Nenhum produto encontrado pra essa busca.</div>';
    return;
  }

  el.innerHTML = '';
  lista.forEach(p => {
    const card = document.createElement('a');
    card.className = 'produto-card';
    card.href = p.link;
    card.target = '_blank';
    card.rel = 'noopener';
    card.onclick = () => {
      fetch('/api/registrar-clique', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uid: uidLojaAtual, itemId: p.id }),
        keepalive: true
      }).catch(() => {});
    };
    card.innerHTML = `
      <div style="position:relative;">
        <img src="${p.img || 'https://via.placeholder.com/300'}">
        <button class="btn-compartilhar" aria-label="Compartilhar">↗️</button>
      </div>
      <div class="info">
        <span class="selo">${escapeHtml(p.plataforma || 'OFERTA')}</span>
        <div class="nome">${escapeHtml(p.nome || 'Produto')}</div>
        <div class="preco">R$ ${escapeHtml(p.preco || '--')}</div>
      </div>
    `;
    card.querySelector('.btn-compartilhar').addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      compartilharProduto(p);
    });
    el.appendChild(card);
  });
}

function filtrarProdutos(termo){
  const termoLimpo = termo.trim().toLowerCase();
  if(!termoLimpo){ renderizarProdutos(todosProdutosAtivos); return; }
  const filtrados = todosProdutosAtivos.filter(p => (p.nome || '').toLowerCase().includes(termoLimpo));
  renderizarProdutos(filtrados);
}

function escurecerCor(hex, porcentagem){
  hex = hex.replace('#','');
  let r = parseInt(hex.substring(0,2),16);
  let g = parseInt(hex.substring(2,4),16);
  let b = parseInt(hex.substring(4,6),16);
  r = Math.max(0, Math.floor(r * (1 - porcentagem/100)));
  g = Math.max(0, Math.floor(g * (1 - porcentagem/100)));
  b = Math.max(0, Math.floor(b * (1 - porcentagem/100)));
  return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
}

async function carregarLoja(){
  const params = new URLSearchParams(window.location.search);
  const uid = params.get('uid');

  if(!uid){
    document.getElementById('headerLoja').innerHTML = '<header><h1 style="color:#fff;">Loja não encontrada</h1></header>';
    return;
  }

  try{
    const doc = await db.collection('usuarios').doc(uid).get();
    const dados = doc.exists ? doc.data() : {};
    const nome = dados.nomeLoja || dados.nome || 'Afiliado';
    const descricao = dados.descricaoLoja || 'Ofertas selecionadas • Compra direto com o afiliado';
    document.title = nome + ' — Loja no Viralize';

    if(dados.corLoja){
      document.documentElement.style.setProperty('--laranja', dados.corLoja);
      document.documentElement.style.setProperty('--laranja-escuro', escurecerCor(dados.corLoja, 15));
    }

    if(dados.plano === 'pago'){
      document.getElementById('topoMarca').style.display = 'none';
      document.getElementById('bannerCta').style.display = 'none';
      document.body.style.paddingBottom = '20px';
    }

    const headerEl = document.getElementById('headerLoja');
    const buscaEl = document.getElementById('buscaFake');

    if(dados.fotoCapa){
      // Estilo Facebook: capa + avatar sobreposto na lateral
      headerEl.innerHTML = `
        <div class="capa-wrap">
          <img class="capa-img" src="${dados.fotoCapa}">
          <div class="avatar-sobre-capa">
            ${dados.fotoPerfil ? `<img src="${dados.fotoPerfil}">` : `<div class="letra">${nome[0].toUpperCase()}</div>`}
          </div>
        </div>
        <div class="header-com-capa-info">
          <h1>${escapeHtml(nome)}</h1>
          <p>${escapeHtml(descricao)}</p>
        </div>
      `;
      buscaEl.style.marginTop = '0';
    } else {
      // Estilo Linktree: só o avatar redondo, sem capa
      headerEl.innerHTML = `
        <header>
          <div class="avatar-loja">${dados.fotoPerfil ? `<img src="${dados.fotoPerfil}">` : nome[0].toUpperCase()}</div>
          <h1>${escapeHtml(nome)}</h1>
          <p>${escapeHtml(descricao)}</p>
        </header>
      `;
      buscaEl.style.marginTop = '-24px';
    }

    const catalogo = await db.collection('usuarios').doc(uid).collection('catalogo').orderBy('criadoEm','desc').get();

    todosProdutosAtivos = catalogo.docs
      .filter(d => d.data().ativo !== false)
      .map(d => ({ id: d.id, ...d.data() }));

    uidLojaAtual = uid;
    renderizarProdutos(todosProdutosAtivos);
  }catch(err){
    console.error(err);
    document.getElementById('headerLoja').innerHTML = '<header><h1 style="color:#fff;">Erro ao carregar loja</h1></header>';
  }
}

carregarLoja();
</script>
</body>
</html>
