<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loja no Viralize</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --laranja:#ee4d2d; --laranja-escuro:#d8431f; --fundo:#f5f5f5;
    --texto:#222; --muted:#888; --borda:#eee;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--fundo);color:var(--texto);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding-bottom:70px;}

  .topo-marca{background:var(--laranja);color:#fff;text-align:center;font-size:12px;padding:6px;font-weight:600;letter-spacing:.3px;}

  /* Cabeçalho SEM capa (padrão, estilo Linktree) */
  header{background:var(--laranja);padding:22px 16px 40px;text-align:center;color:#fff;}
  .avatar-loja{width:64px;height:64px;border-radius:50%;background:#fff;color:var(--laranja);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px;margin:0 auto 10px;border:3px solid rgba(255,255,255,.6);object-fit:cover;overflow:hidden;}
  .avatar-loja img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
  header h1{margin:0;font-size:19px;font-weight:700;}
  header p{margin:4px 0 0;font-size:12.5px;opacity:.9;}

  /* Cabeçalho COM capa (estilo Facebook: banner + avatar sobreposto na lateral) */
  .capa-wrap{position:relative;}
  .capa-img{width:100%;height:150px;object-fit:cover;display:block;background:var(--laranja);}
  .avatar-sobre-capa{position:absolute;left:16px;bottom:-32px;width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:#fff;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.15);}
  .avatar-sobre-capa img{width:100%;height:100%;object-fit:cover;}
  .avatar-sobre-capa .letra{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--laranja);color:#fff;font-weight:800;font-size:26px;}
  .header-com-capa-info{padding:40px 16px 14px;text-align:left;}
  .header-com-capa-info h1{margin:0;font-size:19px;font-weight:700;color:var(--texto);}
  .header-com-capa-info p{margin:4px 0 0;font-size:12.5px;color:var(--muted);}

  .busca-fake{max-width:560px;margin:-24px auto 0;padding:0 16px;}
  .busca-fake .caixa{background:#fff;border-radius:8px;padding:12px 14px;font-size:13px;color:var(--muted);box-shadow:0 2px 8px rgba(0,0,0,.08);}

  main{max-width:560px;margin:0 auto;padding:16px;}
  .titulo-secao{font-size:14px;font-weight:700;color:var(--texto);margin:16px 0 10px;padding-left:2px;}

  .grade{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .produto-card{background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);text-decoration:none;color:inherit;display:block;}
  .produto-card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f0f0f0;display:block;}
  .produto-card .info{padding:8px 10px 10px;}
  .produto-card .nome{font-size:12.5px;line-height:1.3;color:var(--texto);height:32px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-bottom:6px;}
  .produto-card .preco{color:var(--laranja);font-weight:800;font-size:15px;}
  .produto-card .selo{display:inline-block;background:var(--laranja);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;margin-bottom:4px;}
  .btn-compartilhar{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.92);border:none;border-radius:50%;width:28px;height:28px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:pointer;}

  .vazio{text-align:center;color:var(--muted);padding:60px 20px;font-size:14px;}

  .banner-cta{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--borda);padding:12px 16px;text-align:center;box-shadow:0 -2px 10px rgba(0,0,0,.06);}
  .banner-cta p{margin:0 0 8px;font-size:11.5px;color:var(--muted);}
  .banner-cta a{display:inline-block;background:var(--laranja);color:#fff;text-decoration:none;font-weight:700;padding:11px 22px;border-radius:20px;font-size:13px;}

  /* Estilo "página única" (rolagem vertical, um produto por tela) */
  body.modo-reels{padding-bottom:0;background:#000;overflow:hidden;}
  #reelsView{position:fixed;inset:0;background:#000;}
  .reels-scroll{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;}
  .reels-slide{height:100%;width:100%;scroll-snap-align:start;position:relative;overflow:hidden;background:#000;}
  .reels-imagens{position:absolute;inset:0;display:flex;overflow-x:scroll;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;}
  .reels-imagem-item{flex:0 0 100%;width:100%;height:100%;position:relative;scroll-snap-align:start;overflow:hidden;}
  .reels-dots{position:absolute;top:62px;left:0;right:0;z-index:3;display:flex;gap:5px;padding:0 16px;}
  .reels-dots .ponto{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.35);}
  .reels-dots .ponto.ativo{background:#fff;}
  .reels-slide .fundo-blur{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(28px) brightness(.55);transform:scale(1.15);}
  .reels-slide .imagem-produto{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;}
  .reels-topo{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:8px;padding:14px 20px;background:linear-gradient(rgba(0,0,0,.55),transparent);}
  .reels-topo .avatar-mini{width:32px;height:32px;border-radius:50%;overflow:hidden;background:var(--laranja);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;flex-shrink:0;}
  .reels-topo .avatar-mini img{width:100%;height:100%;object-fit:cover;}
  .reels-topo .nome-loja{color:#fff;font-weight:700;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.6);}
  .reels-topo .btn-compartilhar{margin-left:auto;background:rgba(255,255,255,.9);border:none;width:44px;height:44px;min-width:44px;border-radius:50%;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .reels-info{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:20px 16px 34px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75) 60%);}
  .reels-selo{display:inline-block;background:var(--laranja);font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:8px;}
  .reels-nome{font-size:18px;font-weight:800;line-height:1.3;margin-bottom:6px;}
  .reels-preco{font-size:22px;font-weight:800;margin-bottom:14px;}
  .reels-btn{display:inline-block;background:var(--laranja);color:#fff;text-decoration:none;font-weight:700;padding:12px 24px;border-radius:24px;font-size:14px;}
  .reels-upsell{position:fixed;left:16px;right:16px;bottom:14px;z-index:3;background:rgba(255,255,255,.95);color:var(--texto);border-radius:12px;padding:10px 14px;font-size:11.5px;text-align:center;text-decoration:none;display:block;font-weight:600;}
</style>
</head>
<body>

<div class="topo-marca" id="topoMarca">🔥 Loja verificada • Powered by Viralize</div>

<div id="headerLoja"></div>

<div class="busca-fake" id="buscaFake">
  <input type="text" id="inputBusca" class="caixa" placeholder="🔍 Buscar nesta loja..." oninput="filtrarProdutos(this.value)" style="width:100%;border:none;font-size:13px;color:var(--texto);outline:none;font-family:inherit;box-sizing:border-box;">
</div>

<main id="mainGrade">
  <div class="titulo-secao">🛍️ Produtos em destaque</div>
  <div class="grade" id="listaProdutos"></div>
</main>

<div class="banner-cta" id="bannerCta">
  <p>Quer ter uma loja como essa e vender pelos seus links de afiliado?</p>
  <a href="/">Criar minha conta grátis no Viralize</a>
</div>

<div id="reelsView" style="display:none;">
  <div class="reels-topo">
    <div class="avatar-mini" id="reelsAvatarMini"></div>
    <div class="nome-loja" id="reelsNomeLoja"></div>
    <button class="btn-compartilhar" onclick="compartilharProdutoReelsAtual()">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="var(--laranja)"><path d="M14 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg>
    </button>
  </div>
  <div class="reels-scroll" id="reelsScroll"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCbfAv1pw1mO0OiajQZ8_LZUIZ_u2zZIXo",
  authDomain: "viralize-ef54c.firebaseapp.com",
  projectId: "viralize-ef54c",
  storageBucket: "viralize-ef54c.firebasestorage.app",
  messagingSenderId: "52430116190",
  appId: "1:52430116190:web:081c1a40c94e21cd79ebcf"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

let todosProdutosAtivos = [];
let uidLojaAtual = null;
let produtosReelsAtuais = [];
let produtoReelsAtualId = null;

function compartilharProduto(p){
  const texto = `Olha essa oferta: ${p.nome} — R$ ${p.preco || ''}`;
  if(navigator.share){
    navigator.share({ title: p.nome, text: texto, url: p.link }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(`${texto}\n${p.link}`);
    alert('Link copiado! Cole onde quiser compartilhar.');
  }
}

function renderizarProdutos(lista){
  const el = document.getElementById('listaProdutos');

  if(todosProdutosAtivos.length === 0){
    el.innerHTML = '<div class="vazio" style="grid-column:1/-1;">Essa loja ainda não tem produtos no catálogo.</div>';
    return;
  }
  if(lista.length === 0){
    el.innerHTML = '<div class="vazio" style="grid-column:1/-1;">Nenhum produto encontrado pra essa busca.</div>';
    return;
  }

  el.innerHTML = '';
  lista.forEach(p => {
    const card = document.createElement('a');
    card.className = 'produto-card';
    card.href = p.link;
    card.target = '_blank';
    card.rel = 'noopener';
    card.onclick = () => {
      fetch('/api/registrar-clique', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ uid: uidLojaAtual, itemId: p.id }),
        keepalive: true
      }).catch(() => {});
    };
    card.innerHTML = `
      <div style="position:relative;">
        <img src="${p.img || 'https://via.placeholder.com/300'}">
        <button class="btn-compartilhar" aria-label="Compartilhar">↗️</button>
      </div>
      <div class="info">
        <span class="selo">${escapeHtml(p.plataforma || 'OFERTA')}</span>
        <div class="nome">${escapeHtml(p.nome || 'Produto')}</div>
        <div class="preco">R$ ${escapeHtml(p.preco || '--')}</div>
      </div>
    `;
    card.querySelector('.btn-compartilhar').addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      compartilharProduto(p);
    });
    el.appendChild(card);
  });
}

function renderizarReels(produtos, ehPro){
  const el = document.getElementById('reelsScroll');
  produtosReelsAtuais = produtos;

  if(produtos.length === 0){
    el.innerHTML = '<div class="vazio" style="color:#fff;padding-top:40vh;">Essa loja ainda não tem produtos.</div>';
    return;
  }

  el.innerHTML = produtos.map((p, i) => {
    const imagens = (p.imagens && p.imagens.length ? p.imagens : [p.img]).filter(Boolean);
    const temVarias = imagens.length > 1;
    return `
    <div class="reels-slide" data-id="${p.id}">
      ${temVarias ? `
        <div class="reels-dots" id="dots-${p.id}">
          ${imagens.map((_, idx) => `<div class="ponto${idx===0 ? ' ativo' : ''}"></div>`).join('')}
        </div>
        <div class="reels-imagens" data-produto="${p.id}">
          ${imagens.map((url, idx) => `
            <div class="reels-imagem-item">
              <div class="fundo-blur" style="background-image:url('${url}');"></div>
              <img class="imagem-produto" src="${url}" loading="${i===0 && idx===0 ? 'eager' : 'lazy'}">
            </div>
          `).join('')}
        </div>
      ` : `
        <div class="fundo-blur" style="background-image:url('${imagens[0] || ''}');"></div>
        <img class="imagem-produto" src="${imagens[0] || 'https://via.placeholder.com/600'}" loading="${i===0 ? 'eager' : 'lazy'}">
      `}
      <div class="reels-info">
        <div class="reels-selo">${escapeHtml(p.plataforma || 'Oferta')}</div>
        <div class="reels-nome">${escapeHtml(p.nome || 'Produto')}</div>
        <div class="reels-preco">R$ ${escapeHtml(p.preco || '--')}</div>
        <a class="reels-btn" href="${p.link}" target="_blank" rel="noopener" onclick="registrarCliqueReels('${p.id}')">🛒 Comprar agora</a>
      </div>
      ${(!ehPro && i === produtos.length - 1) ? `<a class="reels-upsell" href="/">⭐ Essa loja usa o plano grátis (1 produto). Crie a sua no Viralize →</a>` : ''}
    </div>
  `;
  }).join('');

  // liga a rolagem horizontal (esquerda/direita) de cada produto que tem mais de uma foto
  document.querySelectorAll('.reels-imagens').forEach(galeria => {
    galeria.addEventListener('scroll', () => atualizarPontoAtivo(galeria), { passive: true });
  });

  produtoReelsAtualId = produtos[0].id;
  const scrollEl = document.getElementById('reelsScroll');
  scrollEl.removeEventListener('scroll', atualizarProdutoReelsVisivel);
  scrollEl.addEventListener('scroll', atualizarProdutoReelsVisivel, { passive: true });
}

function atualizarPontoAtivo(galeria){
  const indice = Math.round(galeria.scrollLeft / galeria.clientWidth);
  const produtoId = galeria.dataset.produto;
  const dotsEl = document.getElementById('dots-' + produtoId);
  if(!dotsEl) return;
  dotsEl.querySelectorAll('.ponto').forEach((ponto, i) => {
    ponto.classList.toggle('ativo', i === indice);
  });
}

function atualizarProdutoReelsVisivel(){
  const scrollEl = document.getElementById('reelsScroll');
  const rectContainer = scrollEl.getBoundingClientRect();
  const centro = rectContainer.top + rectContainer.height / 2;
  document.querySelectorAll('.reels-slide').forEach(el => {
    const rect = el.getBoundingClientRect();
    if(rect.top <= centro && rect.bottom >= centro){
      produtoReelsAtualId = el.dataset.id;
    }
  });
}

function compartilharProdutoReelsAtual(){
  const produto = produtosReelsAtuais.find(p => p.id === produtoReelsAtualId) || produtosReelsAtuais[0];
  if(!produto) return;
  const nomeLoja = document.getElementById('reelsNomeLoja').textContent || 'essa loja';
  const link = window.location.href;
  const mensagem = `Olha esse produto que achei: ${produto.nome} — R$ ${produto.preco}\n${link}`;

  if(navigator.share){
    navigator.share({ title: produto.nome, text: `Olha esse produto na loja de ${nomeLoja}!`, url: link }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(mensagem);
    alert('Link copiado! Cole onde quiser compartilhar.');
  }
}

function registrarCliqueReels(itemId){
  fetch('/api/registrar-clique', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ uid: uidLojaAtual, itemId }),
    keepalive: true
  }).catch(() => {});
}

function filtrarProdutos(termo){
  const termoLimpo = termo.trim().toLowerCase();
  if(!termoLimpo){ renderizarProdutos(todosProdutosAtivos); return; }
  const filtrados = todosProdutosAtivos.filter(p => (p.nome || '').toLowerCase().includes(termoLimpo));
  renderizarProdutos(filtrados);
}

function escurecerCor(hex, porcentagem){
  hex = hex.replace('#','');
  let r = parseInt(hex.substring(0,2),16);
  let g = parseInt(hex.substring(2,4),16);
  let b = parseInt(hex.substring(4,6),16);
  r = Math.max(0, Math.floor(r * (1 - porcentagem/100)));
  g = Math.max(0, Math.floor(g * (1 - porcentagem/100)));
  b = Math.max(0, Math.floor(b * (1 - porcentagem/100)));
  return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
}

async function carregarLoja(){
  const params = new URLSearchParams(window.location.search);
  let uid = params.get('uid');
  let slug = params.get('slug');

  // Links "bonitos" (/apelido ou /loja/uid) passam por um rewrite da Vercel que troca
  // o arquivo servido, mas NÃO muda o endereço mostrado no navegador — então
  // window.location.search fica vazio nesses casos. Por isso, quando não vier nada
  // por query string, a gente lê direto do caminho da própria URL.
  if(!uid && !slug){
    const partes = window.location.pathname.split('/').filter(Boolean);
    if(partes[0] === 'loja' && partes[1]){
      uid = decodeURIComponent(partes[1]);
    } else if(partes.length === 1 && partes[0] !== 'loja.html' && partes[0] !== 'index.html'){
      slug = decodeURIComponent(partes[0]);
    }
  }

  if(!uid && !slug){
    document.getElementById('headerLoja').innerHTML = '<header><h1 style="color:#fff;">Loja não encontrada</h1></header>';
    return;
  }

  if(!uid && slug){
    try{
      const busca = await db.collection('usuarios').where('slug','==', slug.toLowerCase()).limit(1).get();
      if(busca.empty){
        document.getElementById('headerLoja').innerHTML = '<header><h1 style="color:#fff;">Loja não encontrada</h1><p style="color:#fff;opacity:.7;">Confira se o link está certo.</p></header>';
        return;
      }
      uid = busca.docs[0].id;
    }catch(err){
      console.error(err);
      document.getElementById('headerLoja').innerHTML = '<header><h1 style="color:#fff;">Erro ao carregar loja</h1></header>';
      return;
    }
  }

  try{
    const doc = await db.collection('usuarios').doc(uid).get();
    const dados = doc.exists ? doc.data() : {};
    const nome = dados.nomeLoja || dados.nome || 'Afiliado';
    const descricao = dados.descricaoLoja || 'Ofertas selecionadas • Compra direto com o afiliado';
    document.title = nome + ' — Loja no Viralize';

    if(dados.corLoja){
      document.documentElement.style.setProperty('--laranja', dados.corLoja);
      document.documentElement.style.setProperty('--laranja-escuro', escurecerCor(dados.corLoja, 15));
    }

    if(dados.plano === 'pago'){
      document.getElementById('topoMarca').style.display = 'none';
      document.getElementById('bannerCta').style.display = 'none';
      document.body.style.paddingBottom = '20px';
    }

    const headerEl = document.getElementById('headerLoja');
    const buscaEl = document.getElementById('buscaFake');
    const estilo = dados.estiloLoja === 'reels' ? 'reels' : 'grade';

    const catalogo = await db.collection('usuarios').doc(uid).collection('catalogo').orderBy('criadoEm','desc').get();
    let produtosAtivos = catalogo.docs
      .filter(d => d.data().ativo !== false)
      .map(d => ({ id: d.id, ...d.data() }));

    uidLojaAtual = uid;

    if(estilo === 'reels'){
      document.body.classList.add('modo-reels');
      document.getElementById('mainGrade').style.display = 'none';
      buscaEl.style.display = 'none';
      document.getElementById('bannerCta').style.display = 'none';
      document.getElementById('topoMarca').style.display = 'none';
      document.getElementById('reelsView').style.display = 'block';

      // no plano grátis, só 1 produto aparece nesse estilo de página única
      if(dados.plano !== 'pago'){
        produtosAtivos = produtosAtivos.slice(0, 1);
      }

      document.getElementById('reelsNomeLoja').textContent = nome;
      document.getElementById('reelsAvatarMini').innerHTML = dados.fotoPerfil
        ? `<img src="${dados.fotoPerfil}">`
        : nome[0].toUpperCase();

      renderizarReels(produtosAtivos, dados.plano === 'pago');
      return; // não monta o header/grade tradicional nesse estilo
    }

    if(dados.fotoCapa){
      // Estilo Facebook: capa + avatar sobreposto na lateral
      headerEl.innerHTML = `
        <div class="capa-wrap">
          <img class="capa-img" src="${dados.fotoCapa}">
          <div class="avatar-sobre-capa">
            ${dados.fotoPerfil ? `<img src="${dados.fotoPerfil}">` : `<div class="letra">${nome[0].toUpperCase()}</div>`}
          </div>
        </div>
        <div class="header-com-capa-info">
          <h1>${escapeHtml(nome)}</h1>
          <p>${escapeHtml(descricao)}</p>
        </div>
      `;
      buscaEl.style.marginTop = '0';
    } else {
      // Estilo Linktree: só o avatar redondo, sem capa
      headerEl.innerHTML = `
        <header>
          <div class="avatar-loja">${dados.fotoPerfil ? `<img src="${dados.fotoPerfil}">` : nome[0].toUpperCase()}</div>
          <h1>${escapeHtml(nome)}</h1>
          <p>${escapeHtml(descricao)}</p>
        </header>
      `;
      buscaEl.style.marginTop = '-24px';
    }

    todosProdutosAtivos = produtosAtivos;
    renderizarProdutos(todosProdutosAtivos);
  }catch(err){
    console.error(err);
    document.getElementById('headerLoja').innerHTML = '<header><h1 style="color:#fff;">Erro ao carregar loja</h1></header>';
  }
}

carregarLoja();
</script>
</body>
</html>
